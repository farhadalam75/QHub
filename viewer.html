<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document Viewer - QHub</title>
    <link rel="stylesheet" href="assets/css/library.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="assets/js/viewer.js"></script>
</head>
<body class="viewer-body">
    <header class="viewer-header">
        <a id="back" href="browse.html" class="icon-button" title="Back to folder" aria-label="Back to folder"><i class="fas fa-arrow-left" aria-hidden="true"></i></a>
        <h1 id="file-name">QHub</h1>
        <a id="open-original" class="icon-button" target="_blank" rel="noopener" title="Open original" aria-label="Open original"><i class="fas fa-external-link-alt" aria-hidden="true"></i></a>
        <button id="download" class="icon-button" title="Download" aria-label="Download" disabled><i class="fas fa-download" aria-hidden="true"></i></button>
        <button id="fullscreen" class="icon-button" title="Fullscreen" aria-label="Fullscreen"><i class="fas fa-expand" aria-hidden="true"></i></button>
    </header>
    <nav id="pdf-controls" class="pdf-controls" aria-label="PDF controls" hidden>
        <button id="previous" class="icon-button" title="Previous page" aria-label="Previous page"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
        <label>Page <input id="page" type="number" min="1" value="1" aria-label="Page number"> <span id="page-count"></span></label>
        <button id="next" class="icon-button" title="Next page" aria-label="Next page"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        <select id="zoom" aria-label="PDF zoom"><option value="1">Fit width</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
    </nav>
    <p id="status" role="status">Loading document...</p>
    <main id="viewer-content" class="viewer-content"></main>
</body>
</html>
