<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer - QHub</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .viewer-container {
            width: 100%;
            height: 100vh;
            padding: 0;
            margin: 0;
            background: #f5f5f5;
        }
        
        .viewer-header {
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .viewer-content {
            margin-top: 60px;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        
        .pdf-viewer, .image-viewer {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .image-viewer {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        
        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn-secondary {
            background: #95a5a6;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
            color: #666;
        }
        
        .error {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            color: #e74c3c;
        }
        
        .file-info {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="viewer-header">
            <div class="file-info">
                <span id="file-name">Loading...</span>
            </div>
            <div class="controls">
                <a href="index.html" class="btn btn-secondary">← Back to Hub</a>
                <button id="download-btn" class="btn">Download</button>
                <button id="fullscreen-btn" class="btn">Fullscreen</button>
            </div>
        </div>
        
        <div class="viewer-content">
            <div id="loading" class="loading">
                📄 Loading document...
            </div>
            <div id="error" class="error" style="display: none;">
                <h3>⚠️ Unable to load document</h3>
                <p>The file might not exist or there was an error loading it.</p>
                <a href="index.html" class="btn">Return to Hub</a>
            </div>
        </div>
    </div>

    <script>
        class DocumentViewer {
            constructor() {
                this.initViewer();
            }
            
            initViewer() {
                const urlParams = new URLSearchParams(window.location.search);
                const filePath = urlParams.get('file');
                
                if (!filePath) {
                    this.showError('No file specified');
                    return;
                }
                
                this.loadDocument(filePath);
                this.setupControls(filePath);
            }
            
            loadDocument(filePath) {
                const fileExt = filePath.split('.').pop().toLowerCase();
                const fileName = decodeURIComponent(filePath.split('/').pop());
                
                document.getElementById('file-name').textContent = fileName;
                
                if (fileExt === 'pdf') {
                    this.loadPDF(filePath);
                } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(fileExt)) {
                    this.loadImage(filePath);
                } else if (fileExt === 'txt') {
                    this.loadText(filePath);
                } else {
                    this.showError('Unsupported file type: ' + fileExt);
                }
            }
            
            loadPDF(filePath) {
                const viewerContent = document.querySelector('.viewer-content');
                const loading = document.getElementById('loading');
                
                // Try to use browser's built-in PDF viewer
                const iframe = document.createElement('iframe');
                iframe.className = 'pdf-viewer';
                iframe.src = filePath;
                
                iframe.onload = () => {
                    loading.style.display = 'none';
                };
                
                iframe.onerror = () => {
                    this.showError('Failed to load PDF');
                };
                
                viewerContent.appendChild(iframe);
            }
            
            loadImage(filePath) {
                const viewerContent = document.querySelector('.viewer-content');
                const loading = document.getElementById('loading');
                
                const imageContainer = document.createElement('div');
                imageContainer.className = 'image-viewer';
                
                const img = document.createElement('img');
                img.src = filePath;
                img.alt = 'Document Image';
                
                img.onload = () => {
                    loading.style.display = 'none';
                };
                
                img.onerror = () => {
                    this.showError('Failed to load image');
                };
                
                imageContainer.appendChild(img);
                viewerContent.appendChild(imageContainer);
            }
            
            loadText(filePath) {
                const viewerContent = document.querySelector('.viewer-content');
                const loading = document.getElementById('loading');
                
                fetch(filePath)
                    .then(response => response.text())
                    .then(text => {
                        const pre = document.createElement('pre');
                        pre.style.cssText = 'padding: 20px; margin: 0; white-space: pre-wrap; font-family: monospace; height: 100%; overflow: auto; background: white;';
                        pre.textContent = text;
                        
                        viewerContent.appendChild(pre);
                        loading.style.display = 'none';
                    })
                    .catch(error => {
                        this.showError('Failed to load text file');
                    });
            }
            
            setupControls(filePath) {
                const downloadBtn = document.getElementById('download-btn');
                const fullscreenBtn = document.getElementById('fullscreen-btn');
                
                downloadBtn.onclick = () => {
                    const link = document.createElement('a');
                    link.href = filePath;
                    link.download = filePath.split('/').pop();
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                };
                
                fullscreenBtn.onclick = () => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        document.documentElement.requestFullscreen();
                    }
                };
            }
            
            showError(message) {
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'flex';
                errorDiv.querySelector('p').textContent = message;
            }
        }
        
        // Initialize viewer when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new DocumentViewer();
        });
    </script>
</body>
</html>
